name: FixNear Trust Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-build-and-test:
    name: Build, Audit & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Run Root Security Audit
        run: npm audit --audit-level=high

      - name: Run Server Security Audit
        run: npm audit --prefix server --audit-level=high

      - name: Verify Frontend Production Build
        run: npm run build

      - name: Run Server Automated Tests (Vitest & MongoDB Memory Server)
        run: cd server && npm test
        env:
          NODE_ENV: test
          CI: true

